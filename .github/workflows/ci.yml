name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vite-project/package-lock.json
      - working-directory: vite-project
        run: npm ci
      - working-directory: vite-project
        run: npm run lint
      - working-directory: vite-project
        run: npm test
      - working-directory: vite-project
        run: npm run build
